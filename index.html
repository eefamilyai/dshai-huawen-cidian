r":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"救助","p":"jiùzhù","pos":"动","cn":"拯救和帮助","en":"to rescue and help","exs":["消防员及时救助了被困的居民。","他掏钱救助了那位老人。","社会救助体系让困难家庭有了依靠。"],"ex":"消防员及时救助了被困的居民。","nt":"救助站｜紧急救助","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"施救","p":"shījiù","pos":"动","cn":"实施救援","en":"to administer rescue","exs":["路人立刻上前施救。","在专业救援到来之前，他先做了简单的施救。","不会游泳的人不要贸然下水施救。"],"ex":"路人立刻上前施救。","nt":"现场施救｜及时施救","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"呼救","p":"hūjiù","pos":"动","cn":"大声喊人救援","en":"to call for help","exs":["落水者拼命呼救。","他一边呼救，一边拨打急救电话。","听到呼救声，邻居们纷纷跑出来。"],"ex":"落水者拼命呼救。","nt":"大声呼救｜呼救声","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"挣扎","p":"zhēngzhá","pos":"动","cn":"用力支撑、摆脱","en":"to struggle","exs":["孩子在水中挣扎，情况十分危险。","他在病床上挣扎了半年，终于康复。","内心挣扎了很久，他才做出决定。"],"ex":"孩子在水中挣扎，情况十分危险。","nt":"拼命挣扎｜内心挣扎","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"溺水","p":"nìshuǐ","pos":"动","cn":"淹在水里","en":"to drown","exs":["每年都有孩童溺水的新闻。","他被救起时已接近溺水。","家长要提醒孩子远离危险水域，防止溺水。"],"ex":"每年都有孩童溺水的新闻。","nt":"溺水身亡｜防溺水","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"敬佩","p":"jìngpèi","pos":"动","cn":"敬重佩服","en":"to admire","exs":["我很敬佩那位奋不顾身的叔叔。","他的勇气让人敬佩。","同学们对这位新来的老师十分敬佩。"],"ex":"我很敬佩那位奋不顾身的叔叔。","nt":"令人敬佩｜深感敬佩｜近义：钦佩","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"平凡","p":"píngfán","pos":"形","cn":"平常，不奇特","en":"ordinary","exs":["他做着最平凡的工作，却在关键时刻救了一条命。","平凡的日子里也有小小的幸福。","平凡不等于平庸。"],"ex":"他做着最平凡的工作，却在关键时刻救了一条命。","nt":"平凡的人｜平凡的生活｜反义：非凡","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"伟大","p":"wěidà","pos":"形","cn":"品格崇高，超出寻常","en":"great","exs":["危难中挺身而出的人，是伟大的。","这是一项伟大的发明。","母亲的爱，平凡而伟大。"],"ex":"危难中挺身而出的人，是伟大的。","nt":"伟大的精神｜平凡而伟大","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"义无反顾","p":"yìwúfǎngù","pos":"成语","cn":"为正义而勇往直前，绝不退缩","en":"","exs":["他义无反顾地冲进火场。","既然选择了这条路，就要义无反顾地走下去。","面对危险，救援人员义无反顾。"],"ex":"他义无反顾地冲进火场。","nt":"义无反顾地投入｜近义：勇往直前","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"临危不乱","p":"línwēibùluàn","pos":"成语","cn":"遇到危难时沉着镇定，不慌乱","en":"","exs":["他临危不乱，迅速指挥疏散。","能做到临危不乱，靠的是平时的训练。","船长临危不乱，保住了全船人的性命。"],"ex":"他临危不乱，迅速指挥疏散。","nt":"临危不乱地指挥｜近义：处变不惊","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"舍己为人","p":"shějǐwèirén","pos":"成语","cn":"牺牲自己的利益去帮助别人","en":"","exs":["他舍己为人的精神感动了全城。","这种做法虽然舍己为人，却也要注意自身安全。","舍己为人不是每个人都能做到的。"],"ex":"他舍己为人的精神感动了全城。","nt":"舍己为人的精神｜近义：舍己救人","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"表彰","p":"biǎozhāng","pos":"动/名","cn":"郑重地表扬、奖励","en":"to commend","exs":["学校表彰了那位见义勇为的同学。","他在大会上受到表彰。","这次表彰是对他多年付出的肯定。"],"ex":"学校表彰了那位见义勇为的同学。","nt":"公开表彰｜表彰大会","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"良心","p":"liángxīn","pos":"名","cn":"对是非善恶的正确认识","en":"conscience","exs":["他做这件事，是为了对得起自己的良心。","昧着良心做事，终究会不安。","看到有人需要帮助而不伸手，良心会不安。"],"ex":"他做这件事，是为了对得起自己的良心。","nt":"凭良心｜有良心｜近义：良知","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"贸然","p":"màorán","pos":"副","cn":"轻率地，不加考虑地","en":"rashly","exs":["不要贸然下水救人。","他没弄清情况就贸然答应，后来很后悔。","遇事别贸然下结论。"],"ex":"不要贸然下水救人。","nt":"贸然行动｜贸然答应","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"慌乱","p":"huāngluàn","pos":"形","cn":"慌张而混乱","en":"panicky","exs":["火警一响，有人慌乱了，差点摔倒。","他强迫自己不要慌乱，先找出口。","越是慌乱，越容易出错。"],"ex":"火警一响，有人慌乱了，差点摔倒。","nt":"神色慌乱｜一片慌乱｜反义：镇定","u":6,"uid":"h1u6","ut":"单元六  勇气与担当","tr":"高华","yr":"中一","src":"《中学高级华文（HCL）中一至中三·词语手册》"},{"w":"生死","p":"shēngsǐ","pos":"名","cn":"生存和死亡","en":"life and death","exs":["那是生死 const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS = {
  get(k,d){ try{ const v = localStorage.getItem('cw_'+k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('cw_'+k, JSON.stringify(v)) }catch(e){} }
};
let heard = new Set(LS.get('heard', []));
let marks = LS.get('marks', {});
let scope = 'all';
let queue = [], idx = 0, playing = false, auto = true, rate = 0.85, gen = 0;
let readDef = true, exMode = 'all';

/* ---------- speech ---------- */
const SR = window.speechSynthesis;
let voice = null, zhVoices = [], savedVoice = LS.get('voice','');
function rankVoice(v){
  const n = (v.name || '').toLowerCase();
  let s = 0;
  if(/natural|neural|online/.test(n)) s += 100;
  if(/xiaoxiao|yunxi|yunyang|xiaoyi|yunjian|晓晓|云希|云扬|晓伊|云健/.test(n)) s += 45;
  if(/^zh[-_]cn/i.test(v.lang)) s += 20;
  if(/google/.test(n)) s += 35;
  if(/tingting|meijia|sinji|libby|xiaobei/.test(n)) s += 15;
  if(/huihui|yaoyao|kangkang|sapi/.test(n)) s -= 25;
  if(v.localService === false) s += 5;
  return s;
}
function refreshVoices(){
  if(!SR) return;
  zhVoices = (SR.getVoices() || []).filter(v => /^zh/i.test(v.lang)).sort((a,b) => rankVoice(b) - rankVoice(a));
  voice = zhVoices.find(v => v.voiceURI === savedVoice) || zhVoices[0] || null;
  const sel = document.getElementById('voiceSel');
  if(sel){
    sel.innerHTML = zhVoices.length
      ? zhVoices.map(v => `<option value="${v.voiceURI}" ${voice&&v.voiceURI===voice.voiceURI?'selected':''}>${v.name}</option>`).join('')
      : '<option value="">没有中文语音</option>';
    sel.onchange = () => {
      const pick = zhVoices.find(v => v.voiceURI === sel.value);
      if(pick){ voice = pick; savedVoice = pick.voiceURI; LS.set('voice', savedVoice); }
      if(SR) SR.cancel();
      speak('这是现在的声音。今天天气很好。', rate);
    };
  }
  const warn = document.getElementById('voicehint');
  if(warn){
    if(!zhVoices.length){
      warn.innerHTML = '<div class="warn">这台设备找不到中文语音，朗读用不了。Windows 可到「设置 → 时间和语言 → 语音」添加中文语音包。</div>';
    }else if(rankVoice(zhVoices[0]) < 80){
      warn.innerHTML = '<div class="warn">现在用的是系统自带语音，比较机械。改用 <b>Microsoft Edge</b> 打开同一网页，'
        + '会出现「晓晓／云希」等神经网络语音，自然很多。</div>';
    }else{ warn.innerHTML = ''; }
  }
}
if(SR){ refreshVoices(); SR.onvoiceschanged = refreshVoices; }

function speak(text, r){
  return new Promise(resolve => {
    if(!SR){ setTimeout(resolve, Math.max(600, text.length*160)); return }
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      if(voice) u.voice = voice;
      u.rate = r; u.pitch = 0.98; u.volume = 1;
      let done = false;
      const fin = () => { if(!done){ done = true; resolve() } };
      u.onend = fin; u.onerror = fin;
      SR.speak(u);
      setTimeout(fin, Math.max(2500, text.length * 420 / Math.max(0.5, r)));
    }catch(e){ resolve() }
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function clean(t){
  return String(t == null ? '' : t)
    .replace(/[「」『』【】（）()《》〈〉]/g, '')
    .replace(/…+/g, '，').replace(/——/g, '，').replace(/[•·]/g, '，')
    .replace(/\s+/g, ' ').trim();
}
function exList(w){
  const a = (w.exs && w.exs.length) ? w.exs : (w.ex ? [w.ex] : []);
  return exMode === 'one' ? a.slice(0,1) : a;
}

/* ---------- queue ---------- */
function buildQueue(){
  queue = (scope === 'all' ? D.words : D.words.filter(w => w.uid === scope)).slice();
  const saved = LS.get('lastIdx', {})[scope] || 0;
  idx = Math.min(saved, Math.max(0, queue.length-1));
}
function keyOf(w){ return w.uid + '|' + w.w }
function markHeard(){
  const w = queue[idx]; if(!w) return;
  heard.add(keyOf(w)); LS.set('heard', [...heard]); renderPlayer(); renderChaps();
}
function saveIdx(){ const m = LS.get('lastIdx', {}); m[scope] = idx; LS.set('lastIdx', m) }

/* ---------- player ---------- */
async function playFrom(i){
  if(!queue.length) return;
  const my = ++gen;
  playing = true; idx = i; saveIdx(); renderPlayer();
  while(playing && my === gen && idx < queue.length){
    const w = queue[idx];
    renderPlayer();
    await speak(clean(w.w), rate);
    if(my !== gen || !playing) return;
    await sleep(300); if(my !== gen || !playing) return;
    if(readDef){
      await speak(clean(w.cn), rate);
      if(my !== gen || !playing) return;
      await sleep(300); if(my !== gen || !playing) return;
    }
    for(const s of exList(w)){
      await speak(clean(s), Math.min(1.1, rate + 0.05));
      if(my !== gen || !playing) return;
      await sleep(340); if(my !== gen || !playing) return;
    }
    markHeard();
    if(!auto){ playing = false; renderPlayer(); return }
    await sleep(480); if(my !== gen || !playing) return;
    if(idx >= queue.length - 1){ playing = false; renderPlayer(); return }
    idx++; saveIdx(); renderPlayer();
  }
  playing = false; renderPlayer();
}
function stop(){ gen++; playing = false; if(SR) SR.cancel(); renderPlayer() }

function renderPlayer(){
  const box = $('#player');
  if(!queue.length){ box.innerHTML = '<div class="empty">这个范围里没有词语。</div>'; return }
  const w = queue[idx] || queue[0];
  const pct = Math.round((idx+1)/queue.length*100);
  const isHeard = heard.has(keyOf(w));
  const exs = exList(w);
  box.innerHTML = `
    <div class="player">
      <div class="pword">${esc(w.w)}</div>
      <div class="ppin">${esc(w.p)}　<span style="color:var(--fg3);font-size:12px">${esc(w.pos)}</span></div>
      <div class="pdef">${esc(w.cn)}</div>
      <div class="pex"><span class="lbl">例句</span>
        <ol>${exs.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      </div>
      <div class="pnote">${esc(w.nt)}</div>
      ${playing?'<div class="spk"><span class="dot"></span>正在播放…</div>':''
        +(isHeard?'<div class="spk">✓ 已听过</div>':'')}
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="pmeta"><span>第 ${idx+1} / ${queue.length}</span><span>${esc(w.ut)}</span></div>
      <div class="ctrls">
        <button class="btn" id="bPrev">← 上一个</button>
        <button class="btn pri big" id="bPlay">${playing?'⏸ 暂停':'▶ 播放'}</button>
        <button class="btn" id="bNext">下一个 →</button>
      </div>
      <div class="ctrls">
        <button class="btn" id="bAgain">🔁 重听</button>
        <button class="btn" id="bDef">${readDef?'读释义：开':'读释义：关'}</button>
        <button class="btn" id="bEx">${exMode==='all'?'例句：全部':'例句：一句'}</button>
        <button class="btn" id="bAuto">${auto?'自动连播：开':'自动连播：关'}</button>
        <button class="btn" id="bRate">语速 ${rate.toFixed(2)}×</button>
      </div>
      <div class="note" style="margin-top:12px;font-size:12px">
        朗读顺序：词语${readDef?' → 释义':''} → 例句${exs.length>1?'（'+exs.length+' 句）':''}
      </div>
    </div>`;
  $('#bPlay').onclick = () => { if(playing) stop(); else playFrom(idx) };
  $('#bPrev').onclick = () => { stop(); idx = Math.max(0, idx-1); saveIdx(); renderPlayer() };
  $('#bNext').onclick = () => { stop(); idx = Math.min(queue.length-1, idx+1); saveIdx(); renderPlayer() };
  $('#bAgain').onclick = () => { stop(); setTimeout(()=>playFrom(idx), 60) };
  $('#bDef').onclick = () => { readDef = !readDef; LS.set('readDef', readDef); renderPlayer() };
  $('#bEx').onclick = () => { exMode = exMode==='all'?'one':'all'; LS.set('exMode', exMode); renderPlayer() };
  $('#bAuto').onclick = () => { auto = !auto; LS.set('auto', auto); renderPlayer() };
  $('#bRate').onclick = () => { rate = rate >= 1.15 ? 0.7 : +(rate + 0.15).toFixed(2); LS.set('rate', rate); renderPlayer() };
}

/* ---------- chapters ---------- */
function renderChaps(){
  const grid = $('#chapgrid');
  const all = D.words.length, hAll = D.words.filter(w=>heard.has(keyOf(w))).length;
  let html = `<div class="chap ${scope==='all'?'on':''}" data-uid="all">
      <div class="t">全部</div><div class="s">${hAll} / ${all} 已听</div>
      <div class="m"><i style="width:${all?hAll/all*100:0}%"></i></div></div>`;
  let lastGroup = null;
  for(const u of D.units){
    const g = u.tr + ' ' + u.yr;
    if(g !== lastGroup){ html += `<div class="grouph" style="grid-column:1/-1">${esc(g)}</div>`; lastGroup = g }
    const ws = D.words.filter(w => w.uid === u.uid);
    const h = ws.filter(w => heard.has(keyOf(w))).length;
    html += `<div class="chap ${scope===u.uid?'on':''}" data-uid="${u.uid}">
      <div class="t">${esc(u.title)}</div>
      <div class="s">${h} / ${ws.length} 已听</div>
      <div class="m"><i style="width:${ws.length?h/ws.length*100:0}%"></i></div></div>`;
  }
  grid.innerHTML = html;
  $$('#chapgrid .chap').forEach(el => el.onclick = () => {
    stop(); scope = el.dataset.uid; buildQueue(); renderChaps(); renderPlayer();
  });
}

/* ---------- list ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
let q = '';
function renderList(){
  const rows = D.words.filter(w => (!q || w.w.includes(q) || w.p.includes(q) || w.cn.includes(q) || (w.ex||'').includes(q))
    && (scope==='all' || w.uid===scope));
  $('#lcount').textContent = `共 ${rows.length} 个词语`;
  $('#list').innerHTML = rows.slice(0, 400).map(w => `
    <div class="row">
      <div>
        <div class="w">${esc(w.w)} <span class="p">${esc(w.p)}</span></div>
        <div class="d">${esc(w.cn)}</div>
        ${(w.exs||[]).map(s=>`<div class="ex">· ${esc(s)}</div>`).join('')}
        <div class="ex" style="color:var(--fg3);opacity:.7">${esc(w.nt)}</div>
      </div>
      <div style="text-align:right">
        <button class="btn" data-say="${esc(w.w)}|${esc(w.cn)}|${esc((w.exs||[]).join(' ;; '))}" style="padding:7px 13px;font-size:13px">🔊 听</button>
        ${heard.has(keyOf(w))?'<div class="heard" style="margin-top:6px">✓ 已听过</div>':''}
      </div>
    </div>`).join('') || '<div class="empty">没有符合条件的词语。</div>';
  $$('#list [data-say]').forEach(b => b.onclick = async () => {
    const parts = b.dataset.say.split('|');
    const w = parts[0], cn = parts[1], exs = parts.slice(2).join('|');
    if(SR) SR.cancel();
    await speak(clean(w), rate); await sleep(300);
    if(readDef){ await speak(clean(cn), rate); await sleep(300); }
    for(const s of exs.split(' ;; ')){ await speak(clean(s), rate); await sleep(300); }
  });
}

/* ---------- 造句 ---------- */
let cur = null, answered = false;
function pickWord(){
  const pool = D.words.filter(w => scope==='all' || w.uid===scope);
  if(!pool.length) return null;
  const fresh = pool.filter(w => { const m = marks[w.w]; return !m || m.tries < 2 || !m.pass });
  const src = fresh.length ? fresh : pool;
  return src[Math.floor(Math.random()*src.length)];
}
function newTest(){
  cur = pickWord(); answered = false;
  if(!cur){ $('#tj').innerHTML = '<div class="empty">这个范围里没有词语。</div>'; return }
  const exs = (cur.exs && cur.exs.length) ? cur.exs : [cur.ex];
  $('#tj').innerHTML = `
    <div class="tcard">
      <div style="font-size:11px;letter-spacing:.14em;color:var(--fg3)">用这个词语造一个句子</div>
      <div class="tword">${esc(cur.w)}</div>
      <div class="tpin">${esc(cur.p)}　<span style="color:var(--fg3);font-size:12px">${esc(cur.pos)}</span></div>
      <div class="tdef">${esc(cur.cn)}</div>
      <textarea id="ans" placeholder="在这里写下你的句子…"></textarea>
      <div class="ctrls" style="justify-content:flex-start;margin-top:14px">
        <button class="btn pri" id="bCheck">检查我的句子</button>
        <button class="btn" id="bModel">🔊 听词语和例句</button>
        <button class="btn" id="bSkip">换一题</button>
      </div>
      <ul class="checks" id="checks"></ul>
      <div id="modelbox"></div>
    </div>
    <div class="score" id="scorebox"></div>`;
  $('#bCheck').onclick = check;
  $('#bSkip').onclick = newTest;
  $('#bModel').onclick = async () => {
    if(SR) SR.cancel();
    await speak(clean(cur.w), rate); await sleep(300);
    await speak(clean(cur.cn), rate); await sleep(300);
    for(const s of exs){ await speak(clean(s), rate); await sleep(300); }
  };
  $('#ans').focus();
  $('#ans').addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) check() });
  renderScore();
}
function check(){
  try{
    if(answered) return;
    const s = $('#ans').value.trim();
    const w = cur.w;
    const res = [];
    const hasWord = s.includes(w);
    res.push([hasWord?'ok':'no', hasWord?'用到了「'+w+'」':'句子里没有出现「'+w+'」']);
    const len = s.replace(/[\s，。！？、；：""'']/g,'').length;
    res.push([len>=8?'ok':'no', len>=8?'句子够长（'+len+'字）':'句子太短（只有'+len+'字，至少8字）']);
    const endOk = /[。！？…]$/.test(s);
    res.push([endOk?'ok':'no', endOk?'有句末标点':'结尾要加。！或？']);
    const exs = (cur.exs && cur.exs.length) ? cur.exs : [cur.ex];
    const diff = !exs.includes(s);
    res.push([diff?'ok':'no', diff?'用自己的句子':'这是照抄例句，试着自己写一句']);
    $('#checks').innerHTML = res.map(([c,t]) => `<li class="${c}">${c==='ok'?'✓':'✕'} ${t}</li>`).join('');
    const pass = hasWord && len >= 8;
    const m = marks[w] || {tries:0, pass:0};
    m.tries++; if(pass) m.pass++;
    marks[w] = m; LS.set('marks', marks);
    $('#modelbox').innerHTML = `<div class="model"><b>参考例句（对照一下）</b>
        ${exs.map((e,i)=>`<div>${i+1}. ${esc(e)}</div>`).join('')}
        <div class="note" style="margin-top:8px">${esc(cur.nt)}</div></div>
      <div class="ctrls" style="justify-content:flex-start;margin-top:14px">
        <button class="btn pri" id="bNextQ">下一题 →</button></div>`;
    $('#bNextQ').onclick = newTest;
    answered = true;
    renderScore();
  }catch(err){
    const c = document.getElementById('checks');
    if(c) c.innerHTML = '<li class="no">检查时出错：' + (err && err.message ? err.message : err) + '</li>';
  }
}
function renderScore(){
  const tries = Object.values(marks).reduce((a,m)=>a+m.tries,0);
  const pass  = Object.values(marks).reduce((a,m)=>a+m.pass,0);
  const done  = Object.values(marks).filter(m=>m.pass>0).length;
  const box = $('#scorebox'); if(!box) return;
  box.innerHTML = `
    <div><b>${done}</b><s>造过的词语</s></div>
    <div><b>${pass}/${tries}</b><s>造对的次数</s></div>
    <div><b>${tries?Math.round(pass/tries*100):0}%</b><s>一次通过率</s></div>
    <div><b>${D.words.length}</b><s>可练词语</s></div>`;
}

/* ---------- progress ---------- */
function renderProgress(){
  const box = $('#prog');
  const all = D.words.length, hAll = D.words.filter(w=>heard.has(keyOf(w))).length;
  const tries = Object.values(marks).reduce((a,m)=>a+m.tries,0);
  const pass  = Object.values(marks).reduce((a,m)=>a+m.pass,0);
  let html = `<div class="score">
    <div><b>${hAll}/${all}</b><s>已听词语</s></div>
    <div><b>${all?Math.round(hAll/all*100):0}%</b><s>听力进度</s></div>
    <div><b>${Object.keys(marks).length}</b><s>造句练过的词</s></div>
    <div><b>${tries?Math.round(pass/tries*100):0}%</b><s>造句通过率</s></div>
  </div><h3 style="font-size:13px;margin:22px 0 10px;color:var(--fg3);letter-spacing:.1em">每一章的进度</h3>`;
  for(const u of D.units){
    const ws = D.words.filter(w=>w.uid===u.uid);
    const h = ws.filter(w=>heard.has(keyOf(w))).length;
    html += `<div class="prog"><div class="h"><span>${esc(u.label)}</span><span>${h}/${ws.length}</span></div>
      <div class="m"><i style="width:${ws.length?h/ws.length*100:0}%"></i></div></div>`;
  }
  html += `<p class="note" style="margin-top:16px">记录只存在这台设备的浏览器里，换设备或清缓存会归零。</p>
    <div class="ctrls" style="justify-content:flex-start;margin-top:12px">
      <button class="btn" id="bReset">清空所有记录</button></div>`;
  box.innerHTML = html;
  $('#bReset').onclick = () => {
    if(confirm('确定清空所有听力记录和造句记录吗？')){
      heard = new Set(); marks = {};
      LS.set('heard',[]); LS.set('marks',{}); LS.set('lastIdx',{});
      renderAll();
    }
  };
}

/* ---------- tabs ---------- */
function show(t){
  if(!['listen','list','test','prog'].includes(t)) t = 'listen';
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.t===t));
  ['listen','list','test','prog'].forEach(id => {
    const el = document.getElementById('v-'+id);
    if(el) el.style.display = (id===t) ? '' : 'none';
  });
  try{ history.replaceState(null, '', '#'+t) }catch(e){}
  if(t!=='listen') stop();
  if(t==='list') renderList();
  if(t==='test') newTest();
  if(t==='prog') renderProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){ renderChaps(); renderPlayer(); renderProgress() }

/* ---------- init ---------- */
auto = LS.get('auto', true);
rate = LS.get('rate', 0.85);
readDef = LS.get('readDef', true);
exMode = LS.get('exMode', 'all');
$('#q').oninput = e => { q = e.target.value.trim(); renderList() };
$('#scopeSel').onchange = e => { stop(); scope = e.target.value; buildQueue(); renderChaps(); renderPlayer(); renderList() };
$$('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
if(!('speechSynthesis' in window)){
  $('#speechwarn').innerHTML = '<div class="warn">这个浏览器不支持语音朗读。请用 Chrome / Edge / Safari。</div>';
}
buildQueue(); renderAll();
show((location.hash || '').replace('#','') || 'listen');
</script>
</body>
</html>
