<style>
:root{--bg:#0f1419;--bg2:#161d26;--card:#1b232e;--line:#2a3543;--fg:#e8eef6;--fg2:#9fb0c4;

*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 15% -10%,#1b2a3f 0%,var(--bg) 55%) fixed;

.wrap{max-width:1000px;margin:0 auto;padding:0 20px 90px}
header{padding:44px 0 22px;text-align:center}
.kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:12px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(100deg,#4a9eff,#3ddc97);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:12px;color:var(--fg2);font-size:14px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:26px 0 20px;
position:sticky;top:0;z-index:20;padding:10px 0;background:rgba(15,20,25,.88);backdrop-filter:blur(14px)}
nav button{background:transparent;border:1px solid var(--line);color:var(--fg2);padding:9px 18px;

nav button:hover{color:var(--fg);border-color:#3d4b5f}
nav button.on{background:var(--blue);border-color:var(--blue);color:#07111d;font-weight:700}
.selrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
select{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:10px 14px;

input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:11px 15px;

input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,158,255,.13)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:11px 20px;border-radius:11px;

.btn:hover{border-color:var(--blue);color:var(--blue)}

.btn:disabled{opacity:.45;cursor:default}

.pnote{font-size:12.5px;color:var(--fg3);margin-top:10px}

.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg3)}

.chapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:22px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:.16s}
.chap:hover{border-color:var(--blue)}
.chap.on{border-color:var(--green);background:rgba(61,220,151,.08)}

.chap .s{font-size:11.5px;color:var(--fg3);margin-top:4px}

.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;

.row .w{font-size:19px;font-weight:700}
.row .p{font-size:12.5px;color:var(--blue)}
.row .d{font-size:13px;color:var(--fg2)}
.row .ex{font-size:13px;color:var(--fg3);margin-top:4px}
.heard{color:var(--green);font-size:11px;border:1px solid var(--green);border-radius:99px;padding:2px 8px}

.tj{max-width:720px;margin:0 auto}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.tword{font-size:34px;font-weight:800}
.tpin{color:var(--blue);font-size:15px;margin-top:4px}
.tdef{color:var(--fg2);font-size:14px;margin-top:8px}
textarea{width:100%;min-height:110px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);

.checks{list-style:none;margin-top:14px;font-size:13.5px}
.checks li{padding:5px 0;color:var(--fg2)}
.checks li.ok{color:var(--green)}
.checks li.no{color:var(--rose)}
.model{margin-top:16px;padding:14px;background:rgba(74,158,255,.08);border-left:3px solid var(--blue);border-radius:8px;font-size:14.5px;line-height:1.8}
.model b{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:5px}
.score{display:flex;gap:22px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.score div{text-align:center}
.score b{display:block;font-size:26px;font-weight:800}
.score s{display:block;text-decoration:none;font-size:11px;color:var(--fg3);letter-spacing:.08em;margin-top:2px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.prog .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.prog .m{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.prog .m i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}
.note{font-size:12.5px;color:var(--fg3);line-height:1.7}
.empty{text-align:center;color:var(--fg3);padding:50px 20px}
.warn{background:rgba(245,185,66,.12);border:1px solid var(--amber);color:var(--amber);
padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
footer{text-align:center;color:var(--fg3);font-size:12px;margin-top:50px;line-height:1.9}
@media(max-width:620px){.row{grid-template-columns:1fr}.player{padding:22px 18px}}
</style>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const LS = {
  get(k,d){ try{ const v = localStorage.getItem('cw_'+k); return v===null?d:JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('cw_'+k, JSON.stringify(v)) }catch(e){} }
};
let heard   = new Set(LS.get('heard', []));      // "uid|word"
let marks   = LS.get('marks', {});               // word -> {tries, pass}
let lastIdx = LS.get('lastIdx', {});             // uid -> index
let scope   = 'all';
let queue = [], idx = 0, playing = false, auto = true, rate = 0.85, gen = 0;
let readDef = true;
let nospeech = false;

/* ---------- speech ---------- */
const SR = window.speechSynthesis;
let voice = null, zhVoices = [], savedVoice = LS.get('voice','');

/* higher score = more natural sounding */
function rankVoice(v){
  const n = (v.name || '').toLowerCase();
  let s = 0;
  if(/natural|neural|online/.test(n)) s += 100;
  if(/xiaoxiao|yunxi|yunyang|xiaoyi|yunjian|晓晓|云希|云扬|晓伊|云健/.test(n)) s += 45;
  if(/^zh[-_]cn/i.test(v.lang)) s += 20;
  if(/google/.test(n)) s += 35;
  if(/tingting|meijia|sinji|libby|xiaobei/.test(n)) s += 15;
  if(/huihui|yaoyao|kangkang|sapi/.test(n)) s -= 25;
  if(v.localService === false) s += 5;
  return s;
}
function refreshVoices(){
  if(!SR) return;
  const vs = SR.getVoices() || [];
  zhVoices = vs.filter(v => /^zh/i.test(v.lang)).sort((a,b) => rankVoice(b) - rankVoice(a));
  voice = zhVoices.find(v => v.voiceURI === savedVoice) || zhVoices[0] || null;
  const sel = document.getElementById('voiceSel');
  if(sel){
    if(!zhVoices.length){
      sel.innerHTML = '<option value="">没有中文语音</option>';
    }else{
      sel.innerHTML = zhVoices.map(v =>
        `<option value="${v.voiceURI}" ${voice && v.voiceURI===voice.voiceURI?'selected':''}>${v.name} (${v.lang})</option>`
      ).join('');
    }
    sel.onchange = () => {
      const pick = zhVoices.find(v => v.voiceURI === sel.value);
      if(pick){ voice = pick; savedVoice = pick.voiceURI; LS.set('voice', savedVoice); }
      if(SR) SR.cancel();
      speak('这是现在的声音。今天天气很好。', rate);
    };
  }
  const warn = document.getElementById('voicehint');
  if(warn){
    if(!zhVoices.length){
      warn.innerHTML = '<div class="warn">这台设备找不到中文语音，朗读功能用不了。Windows 可以到「设置 → 时间和语言 → 语音」添加中文语音包。</div>';
    }else if(rankVoice(zhVoices[0]) < 80){
      warn.innerHTML = '<div class="warn">现在用的是系统自带语音，听起来比较机械。'
        + '换成 <b>Microsoft Edge</b> 打开同一个网页，会有「晓晓 / 云希」等神经网络语音，自然很多——'
        + 'Edge 打开后重选上面的声音即可。</div>';
    }else{
      warn.innerHTML = '';
    }
  }
}
if(SR){ refreshVoices(); SR.onvoiceschanged = refreshVoices; } else { nospeech = true; }

function speak(text, r){
  return new Promise(resolve => {
    if(!SR){ nospeech = true; setTimeout(resolve, Math.max(600, text.length*160)); return }
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      if(voice) u.voice = voice;
      u.rate = r;
      u.pitch = 0.98;
      u.volume = 1;
      let done = false;
      const fin = () => { if(!done){ done = true; resolve() } };
      u.onend = fin; u.onerror = fin;
      SR.speak(u);
      // safety net for browsers that never fire onend
      setTimeout(fin, Math.max(2500, text.length * 420 / Math.max(0.5, r)));
    }catch(e){ resolve() }
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* strip characters a Chinese TTS voice reads badly or skips awkwardly */
function clean(t){
  return String(t == null ? '' : t)
    .replace(/[「」『』【】（）()《》〈〉]/g, '')
    .replace(/…+/g, '，')
    .replace(/——/g, '，')
    .replace(/[•·]/g, '，')
    .replace(/\s+/g, ' ')
    .trim();
}

/* ---------- queue ---------- */
function buildQueue(){
  const list = scope === 'all' ? D.words : D.words.filter(w => w.uid === scope);
  queue = list.slice();
  const saved = LS.get('lastIdx', {})[scope] || 0;
  idx = Math.min(saved, Math.max(0, queue.length-1));
}
function keyOf(w){ return w.uid + '|' + w.w }
function markHeard(){
  const w = queue[idx]; if(!w) return;
  heard.add(keyOf(w)); LS.set('heard', [...heard]); renderPlayer(); renderChaps();
}
function saveIdx(){ const m = LS.get('lastIdx', {}); m[scope] = idx; LS.set('lastIdx', m) }

/* ---------- player ---------- */
async function playFrom(i){
  if(!queue.length) return;
  const my = ++gen;
  playing = true; idx = i; saveIdx(); renderPlayer();
  while(playing && my === gen && idx < queue.length){
    const w = queue[idx];
    renderPlayer();
    await speak(clean(w.w), rate);
    if(my !== gen || !playing) return;
    await sleep(300);
    if(my !== gen || !playing) return;
    if(readDef){
      await speak(clean(w.cn), rate);
      if(my !== gen || !playing) return;
      await sleep(300);
      if(my !== gen || !playing) return;
    }
    await speak(clean(w.ex), Math.min(1.1, rate + 0.05));
    if(my !== gen || !playing) return;
    markHeard();
    if(!auto){ playing = false; renderPlayer(); return }
    await sleep(520);
    if(my !== gen || !playing) return;
    if(idx >= queue.length - 1){ playing = false; renderPlayer(); return }
    idx++; saveIdx(); renderPlayer();
  }
  playing = false; renderPlayer();
}
function stop(){ gen++; playing = false; if(SR) SR.cancel(); renderPlayer() }

function renderPlayer(){
  const box = $('#player');
  if(!queue.length){ box.innerHTML = '<div class="empty">这个范围里没有词语。</div>'; return }
  const w = queue[idx] || queue[0];
  const pct = Math.round((idx+1)/queue.length*100);
  const isHeard = heard.has(keyOf(w));
  box.innerHTML = `
    <div class="player">
      <div class="pword">${esc(w.w)}</div>
      <div class="ppin">${esc(w.p)}　<span style="color:var(--fg3);font-size:12px">${esc(w.pos)}</span></div>
      <div class="pdef">${esc(w.cn)}</div>
      <div class="pex"><span class="lbl">例句</span>${esc(w.ex)}</div>
      <div class="pnote">${esc(w.nt)}</div>
      ${playing?'<div class="spk"><span class="dot"></span>正在播放…</div>':''}
      ${isHeard&&!playing?'<div class="spk" style="color:var(--green)">✓ 已听过</div>':''}
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="pmeta"><span>第 ${idx+1} / ${queue.length}</span><span>${esc(w.ut)}</span></div>
      <div class="ctrls">
        <button class="btn" id="bPrev">← 上一句</button>
        <button class="btn pri big" id="bPlay">${playing?'⏸ 暂停':'▶ 播放'}</button>
        <button class="btn" id="bNext">下一句 →</button>
      </div>
      <div class="ctrls">
        <button class="btn" id="bAgain">🔁 重听这句</button>
        <button class="btn" id="bDef">${readDef?'读释义：开':'读释义：关'}</button>
        <button class="btn" id="bAuto">${auto?'自动连播：开':'自动连播：关'}</button>
        <button class="btn" id="bRate">语速 ${rate.toFixed(2)}×</button>
        <button class="btn" id="bHeard">${isHeard?'✓ 已听过':'标记已听'}</button>
      </div>
      <div class="note" style="margin-top:12px;font-size:12px">
        朗读顺序：词语${readDef?' → 释义':''} → 例句
      </div>
    </div>`;
  $('#bPlay').onclick = () => { if(playing) stop(); else playFrom(idx) };
  $('#bPrev').onclick = () => { stop(); idx = Math.max(0, idx-1); saveIdx(); renderPlayer() };
  $('#bNext').onclick = () => { stop(); idx = Math.min(queue.length-1, idx+1); saveIdx(); renderPlayer() };
  $('#bAgain').onclick = () => { stop(); setTimeout(()=>playFrom(idx), 60) };
  $('#bAuto').onclick = () => { auto = !auto; LS.set('auto', auto); renderPlayer() };
  $('#bDef').onclick = () => { readDef = !readDef; LS.set('readDef', readDef); renderPlayer() };
  $('#bRate').onclick = () => { rate = rate >= 1.15 ? 0.7 : +(rate + 0.15).toFixed(2); LS.set('rate', rate); renderPlayer() };
  $('#bHeard').onclick = () => { if(heard.has(keyOf(w))){ heard.delete(keyOf(w)); LS.set('heard',[...heard]) } else { heard.add(keyOf(w)); LS.set('heard',[...heard]) } renderPlayer(); renderChaps() };
}

/* ---------- chapters ---------- */
function renderChaps(){
  const grid = $('#chapgrid');
  const all = D.words.length, hAll = D.words.filter(w=>heard.has(keyOf(w))).length;
  let html = `<div class="chap ${scope==='all'?'on':''}" data-uid="all">
      <div class="t">全部章节</div><div class="s">${hAll} / ${all} 已听</div>
      <div class="m"><i style="width:${all?hAll/all*100:0}%"></i></div></div>`;
  for(const u of D.units){
    const ws = D.words.filter(w => w.uid === u.uid);
    const h = ws.filter(w => heard.has(keyOf(w))).length;
    html += `<div class="chap ${scope===u.uid?'on':''}" data-uid="${u.uid}">
      <div class="t">${esc(u.t)}</div>
      <div class="s">${h} / ${ws.length} 已听</div>
      <div class="m"><i style="width:${ws.length?h/ws.length*100:0}%"></i></div></div>`;
  }
  grid.innerHTML = html;
  $$('#chapgrid .chap').forEach(el => el.onclick = () => {
    stop(); scope = el.dataset.uid; buildQueue(); renderChaps(); renderPlayer();
  });
}

/* ---------- list ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
let q = '';
function renderList(){
  const rows = D.words.filter(w => (!q || w.w.includes(q) || w.p.includes(q) || w.cn.includes(q) || w.ex.includes(q))
    && (scope==='all' || w.uid===scope));
  $('#lcount').textContent = `共 ${rows.length} 个词语`;
  $('#list').innerHTML = rows.map(w => `
    <div class="row">
      <div>
        <div class="w">${esc(w.w)} <span class="p">${esc(w.p)}</span></div>
        <div class="d">${esc(w.cn)}</div>
        <div class="ex">${esc(w.ex)}</div>
      </div>
      <div style="text-align:right">
        <button class="btn" data-say="${esc(w.w)}|${esc(w.cn)}|${esc(w.ex)}" style="padding:7px 13px;font-size:13px">🔊 听</button>
        ${heard.has(keyOf(w))?'<div class="heard" style="display:inline-block;margin-top:6px">✓ 已听过</div>':''}
      </div>
    </div>`).join('') || '<div class="empty">没有符合条件的词语。</div>';
  $$('#list [data-say]').forEach(b => b.onclick = async () => {
    const [w, cn, ex] = b.dataset.say.split('|');
    if(SR) SR.cancel();
    await speak(clean(w), rate);
    await sleep(300);
    if(readDef){ await speak(clean(cn), rate); await sleep(300); }
    await speak(clean(ex), rate);
  });
}

/* ---------- 造句 ---------- */
let cur = null, answered = false;
function pickWord(){
  const pool = D.words.filter(w => scope==='all' || w.uid===scope);
  if(!pool.length) return null;
  // prefer words not yet passed
  const fresh = pool.filter(w => { const m = marks[w.w]; return !m || m.tries < 2 || !m.pass });
  const src = fresh.length ? fresh : pool;
  return src[Math.floor(Math.random()*src.length)];
}
function newTest(){
  cur = pickWord(); answered = false;
  if(!cur){ $('#tj').innerHTML = '<div class="empty">这个范围里没有词语。</div>'; return }
  $('#tj').innerHTML = `
    <div class="tcard">
      <div style="font-size:11px;letter-spacing:.14em;color:var(--fg3)">用这个词语造一个句子</div>
      <div class="tword">${esc(cur.w)}</div>
      <div class="tpin">${esc(cur.p)}　<span style="color:var(--fg3);font-size:12px">${esc(cur.pos)}</span></div>
      <div class="tdef">${esc(cur.cn)}</div>
      <textarea id="ans" placeholder="在这里写下你的句子，例如：${esc(cur.ex.slice(0,6))}…"></textarea>
      <div class="ctrls" style="justify-content:flex-start;margin-top:14px">
        <button class="btn pri" id="bCheck">检查我的句子</button>
        <button class="btn" id="bModel">🔊 听词语和例句</button>
        <button class="btn" id="bSkip">换一题</button>
      </div>
      <ul class="checks" id="checks"></ul>
      <div id="modelbox"></div>
    </div>
    <div class="score" id="scorebox"></div>`;
  $('#bCheck').onclick = check;
  $('#bSkip').onclick = newTest;
  $('#bModel').onclick = async () => {
    if(SR) SR.cancel();
    await speak(clean(cur.w), rate); await sleep(300);
    await speak(clean(cur.cn), rate); await sleep(300);
    await speak(clean(cur.ex), rate);
  };
  $('#ans').focus();
  $('#ans').addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) check() });
  renderScore();
}
function check(){
  try{
  if(answered) return;
  const s = $('#ans').value.trim();
  const w = cur.w;
  const res = [];
  const hasWord = s.includes(w);
  res.push([hasWord ? 'ok' : 'no', hasWord ? '用到了「'+w+'」' : '句子里没有出现「'+w+'」']);
  const len = s.replace(/[\s，。！？、；：""'']/g,'').length;
  res.push([len>=8 ? 'ok':'no', len>=8 ? '句子够长（'+len+'字）' : '句子太短了（只有'+len+'字，至少8字）']);
  const endOk = /[。！？…]$/.test(s);
  res.push([endOk?'ok':'no', endOk ? '有句末标点' : '结尾要加。！或？']);
  const diff = s !== cur.ex;
  res.push([diff?'ok':'no', diff ? '用自己的句子（不是照抄）' : '这是照抄课文例句，试着自己造']);
  $('#checks').innerHTML = res.map(([c,t]) => `<li class="${c}">${c==='ok'?'✓':'✕'} ${t}</li>`).join('');
  const pass = hasWord && len >= 8;
  const m = marks[w] || {tries:0, pass:0};
  m.tries++; if(pass) m.pass++;
  marks[w] = m; LS.set('marks', marks);
  $('#modelbox').innerHTML = `<div class="model"><b>课文例句（对照一下）</b>${esc(cur.ex)}<div class="note" style="margin-top:8px">${esc(cur.note)}</div></div>
    <div class="ctrls" style="justify-content:flex-start;margin-top:14px">
      <button class="btn pri" id="bNextQ">下一题 →</button>
    </div>`;
  $('#bNextQ').onclick = newTest;
  answered = true;
  renderScore();
  }catch(err){
    const c = document.getElementById('checks');
    if(c) c.innerHTML = '<li class="no">检查时出错：' + (err && err.message ? err.message : err) + '</li>';
  }
}
function renderScore(){
  const totalTries = Object.values(marks).reduce((a,m)=>a+m.tries,0);
  const totalPass  = Object.values(marks).reduce((a,m)=>a+m.pass,0);
  const passed = Object.values(marks).filter(m=>m.pass>0).length;
  const box = $('#scorebox');
  if(!box) return;
  box.innerHTML = `
    <div><b>${passed}</b><s>造过的词语</s></div>
    <div><b>${totalPass}/${totalTries}</b><s>造对的次数</s></div>
    <div><b>${totalTries?Math.round(totalPass/totalTries*100):0}%</b><s>一次通过率</s></div>
    <div><b>${D.words.length}</b><s>可练词语</s></div>`;
}

/* ---------- progress ---------- */
function renderProgress(){
  const box = $('#prog');
  const all = D.words.length, hAll = D.words.filter(w=>heard.has(keyOf(w))).length;
  const tries = Object.values(marks).reduce((a,m)=>a+m.tries,0);
  const pass  = Object.values(marks).reduce((a,m)=>a+m.pass,0);
  let html = `<div class="score">
    <div><b>${hAll}/${all}</b><s>已听词语</s></div>
    <div><b>${all?Math.round(hAll/all*100):0}%</b><s>听力进度</s></div>
    <div><b>${Object.keys(marks).length}</b><s>造句练过的词</s></div>
    <div><b>${tries?Math.round(pass/tries*100):0}%</b><s>造句通过率</s></div>
  </div><h3 style="font-size:14px;margin:22px 0 12px;color:var(--fg2)">每一章的进度</h3>`;
  for(const u of D.units){
    const ws = D.words.filter(w=>w.uid===u.uid);
    const h = ws.filter(w=>heard.has(keyOf(w))).length;
    const p = ws.length ? h/ws.length*100 : 0;
    html += `<div class="prog"><div class="h"><span>${esc(u.t)}</span><span>${h}/${ws.length}</span></div>
      <div class="m"><i style="width:${p}%"></i></div></div>`;
  }
  html += `<p class="note" style="margin-top:18px">这些记录只存在这台设备的浏览器里（localStorage）。换设备或清缓存后会归零。</p>
    <div class="ctrls" style="justify-content:flex-start;margin-top:14px">
      <button class="btn" id="bReset">清空所有记录</button></div>`;
  box.innerHTML = html;
  $('#bReset').onclick = () => {
    if(confirm('确定要清空所有听力记录和造句记录吗？')){
      heard = new Set(); marks = {}; lastIdx = {};
      LS.set('heard',[]); LS.set('marks',{}); LS.set('lastIdx',{});
      renderAll();
    }
  };
}

/* ---------- tabs ---------- */
function show(t){
  if(!['listen','list','test','prog'].includes(t)) t = 'listen';
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.t===t));
  ['listen','list','test','prog'].forEach(id => {
    const el = document.getElementById('v-'+id);
    if(el) el.style.display = (id===t) ? '' : 'none';
  });
  try{ history.replaceState(null, '', '#'+t) }catch(e){}
  if(t!=='listen') stop();
  if(t==='list') renderList();
  if(t==='test') newTest();
  if(t==='prog') renderProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){ renderChaps(); renderPlayer(); renderList(); renderProgress() }

/* ---------- init ---------- */
auto = LS.get('auto', true);
rate = LS.get('rate', 0.85);
readDef = LS.get('readDef', true);
$('#q').oninput = e => { q = e.target.value.trim(); renderList() };
$('#scopeSel').onchange = e => { stop(); scope = e.target.value; buildQueue(); renderChaps(); renderPlayer(); renderList() };
$$('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
if(!('speechSynthesis' in window)){
  $('#speechwarn').innerHTML = '<div class="warn">这个浏览器不支持语音朗读。请用 Chrome / Edge / Safari 打开。</div>';
}
buildQueue(); renderAll();
show((location.hash || '').replace('#','') || 'listen');
</script>
</body>
</html>
